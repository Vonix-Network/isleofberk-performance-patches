static byte[] concatZipBytes(byte[]... parts) {
    int total = 0
    for (int i = 0; i < parts.length; i++) {
        total += parts[i].length
    }
    byte[] out = new byte[total]
    int pos = 0
    for (int i = 0; i < parts.length; i++) {
        System.arraycopy(parts[i], 0, out, pos, parts[i].length)
        pos += parts[i].length
    }
    return out
}

static byte[] zipExtraBlock(int id, byte[] payload) {
    byte[] block = new byte[4 + payload.length]
    zipW16(block, 0, id)
    zipW16(block, 2, payload.length)
    System.arraycopy(payload, 0, block, 4, payload.length)
    return block
}

static byte[] zipNtfsAttribute(int tag, byte[] attrPayload) {
    byte[] rec = new byte[4 + attrPayload.length]
    zipW16(rec, 0, tag)
    zipW16(rec, 2, attrPayload.length)
    System.arraycopy(attrPayload, 0, rec, 4, attrPayload.length)
    return rec
}

static byte[] fillZipBytes(int length, int startValue) {
    byte[] out = new byte[length]
    for (int i = 0; i < length; i++) {
        out[i] = (byte) ((startValue + i) & 0xff)
    }
    return out
}

static byte[] zipSingleByte(int value) {
    return [(byte) (value & 0xff)] as byte[]
}

static byte[] infoZipUxPayload(byte[] atime, byte[] mtime, byte[] uid, byte[] gid) {
    return concatZipBytes(atime, mtime, uid, gid)
}

static byte[] findZipExtraPayload(byte[] extra, int extraLength, int wantedId) {
    int cursor = 0
    while (cursor + 4 <= extraLength) {
        int id = zipU16(extra, cursor)
        int size = zipU16(extra, cursor + 2)
        if (cursor + 4 + size > extraLength) {
            throw new GradleException("infoZipUxExtraFixture: truncated extra field 0x${Integer.toHexString(id)}")
        }
        if (id == wantedId) {
            byte[] payload = new byte[size]
            System.arraycopy(extra, cursor + 4, payload, 0, size)
            return payload
        }
        cursor += 4 + size
    }
    return null
}

static byte[] sliceZipBytes(byte[] src, int from, int toExclusive) {
    if (src == null || from < 0 || toExclusive < from || toExclusive > src.length) {
        throw new GradleException("infoZipUxExtraFixture: invalid slice ${from}..${toExclusive} of ${src == null ? -1 : src.length}")
    }
    byte[] out = new byte[toExclusive - from]
    System.arraycopy(src, from, out, 0, out.length)
    return out
}

static void requireZipBytes(String label, byte[] actual, byte[] expected) {
    if (actual == null) {
        throw new GradleException("infoZipUxExtraFixture: ${label}: missing bytes")
    }
    if (actual.length != expected.length) {
        throw new GradleException("infoZipUxExtraFixture: ${label}: length ${actual.length} != ${expected.length}")
    }
    for (int i = 0; i < expected.length; i++) {
        if (actual[i] != expected[i]) {
            throw new GradleException("infoZipUxExtraFixture: ${label}: byte ${i} changed")
        }
    }
}

static byte[] buildMinimalStoredZip(String name, byte[] payload, byte[] extra, int dosTime, int dosDate) {
    byte[] nameBytes = name.getBytes('UTF-8')
    def crc32 = new java.util.zip.CRC32()
    crc32.update(payload)
    long crc = crc32.value
    int nameLen = nameBytes.length
    int extraLen = extra.length
    int localLen = 30 + nameLen + extraLen + payload.length
    int cdLen = 46 + nameLen + extraLen
    byte[] zip = new byte[localLen + cdLen + 22]
    int p = 0
    zipW32(zip, p, 0x04034b50L); p += 4
    zipW16(zip, p, 20); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, dosTime); p += 2
    zipW16(zip, p, dosDate); p += 2
    zipW32(zip, p, crc); p += 4
    zipW32(zip, p, payload.length); p += 4
    zipW32(zip, p, payload.length); p += 4
    zipW16(zip, p, nameLen); p += 2
    zipW16(zip, p, extraLen); p += 2
    System.arraycopy(nameBytes, 0, zip, p, nameLen); p += nameLen
    System.arraycopy(extra, 0, zip, p, extraLen); p += extraLen
    System.arraycopy(payload, 0, zip, p, payload.length); p += payload.length
    int cdOff = p
    zipW32(zip, p, 0x02014b50L); p += 4
    zipW16(zip, p, 20); p += 2
    zipW16(zip, p, 20); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, dosTime); p += 2
    zipW16(zip, p, dosDate); p += 2
    zipW32(zip, p, crc); p += 4
    zipW32(zip, p, payload.length); p += 4
    zipW32(zip, p, payload.length); p += 4
    zipW16(zip, p, nameLen); p += 2
    zipW16(zip, p, extraLen); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW32(zip, p, 0L); p += 4
    zipW32(zip, p, 0L); p += 4
    System.arraycopy(nameBytes, 0, zip, p, nameLen); p += nameLen
    System.arraycopy(extra, 0, zip, p, extraLen); p += extraLen
    zipW32(zip, p, 0x06054b50L); p += 4
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 1); p += 2
    zipW16(zip, p, 1); p += 2
    zipW32(zip, p, cdLen); p += 4
    zipW32(zip, p, cdOff); p += 4
    zipW16(zip, p, 0); p += 2
    return zip
}

static void expectGradleFailure(String label, String needle, Closure action) {
    try {
        action.call()
        throw new GradleException("infoZipUxExtraFixture: ${label} did not fail closed")
    } catch (GradleException ex) {
        if (ex.message != null && ex.message.contains('did not fail closed')) {
            throw ex
        }
        if (ex.message == null || !ex.message.contains(needle)) {
            throw new GradleException("infoZipUxExtraFixture: ${label}: unexpected failure: ${ex.message}")
        }
    }
}

static void assertUtSelectedTimestamps(int flags, int selectedCount, byte[] trailing, String label) {
    byte[] timestamps = fillZipBytes(selectedCount * 4, 0xA0)
    byte[] extra = zipExtraBlock(0x5455, concatZipBytes(zipSingleByte(flags), timestamps, trailing))
    int beforeLen = extra.length
    zeroZipTimestampExtra(extra, 0, extra.length)
    if (extra.length != beforeLen) {
        throw new GradleException("infoZipUxExtraFixture: ${label}: extra-field length changed")
    }
    byte[] after = findZipExtraPayload(extra, extra.length, 0x5455)
    requireZipBytes("${label} flags", sliceZipBytes(after, 0, 1), zipSingleByte(flags))
    requireZipBytes("${label} timestamps", sliceZipBytes(after, 1, 1 + timestamps.length), new byte[timestamps.length])
    if (trailing.length > 0) {
        requireZipBytes("${label} trailing", sliceZipBytes(after, 1 + timestamps.length, after.length), trailing)
    }
}

