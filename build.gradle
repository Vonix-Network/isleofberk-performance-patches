plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '5.1.77'
    id 'org.spongepowered.mixin' version '0.7.38'
}

def forgeVersion = project.findProperty('forgeVersion') ?: '40.3.0'
def iobVersion = project.findProperty('iobVersion') ?: '1.2.0'
def serverRunDir = project.findProperty('serverRunDir')
def runtimeArtifact = project.findProperty('runtimeArtifact')
version = project.findProperty('version') ?: '0.1.0'
group = 'network.vonix.isleofberkperformance'
// Companion performance-patch artifact name (not an IoB fork/replacement).
archivesBaseName = 'isleof-berk-performance-patches'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.18.2'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { isleofberkperformance { source sourceSets.main } }
        }
        server {
            workingDirectory project.file(serverRunDir ?: 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            if (!runtimeArtifact) {
                mods { isleofberkperformance { source sourceSets.main } }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'isleofberkperformance.refmap.json'
    config 'isleofberkperformance.mixins.json'
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.18.2-${forgeVersion}"
    // Compile against original IoB + GeckoLib; never shade/bundle them into this companion JAR.
    compileOnly fg.deobf("local:isleofberk-${iobVersion}:${iobVersion}")
    compileOnly fg.deobf('local:geckolib-forge-1.18-3.0.57:3.0.57')
    runtimeOnly fg.deobf("local:isleofberk-${iobVersion}:${iobVersion}")
    runtimeOnly fg.deobf('local:geckolib-forge-1.18-3.0.57:3.0.57')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    inputs.properties([version: project.version])
    filesMatching('META-INF/mods.toml') {
        // mods.toml pins the original Isle of Berk dependency to [1.2.0,1.2.0.1).
        expand(version: project.version)
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title'     : 'isleof-berk-performance-patches',
            'Specification-Vendor'    : 'Vonix-Network',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'Isle of Berk Performance Patches (companion)',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Vonix-Network',
            'MixinConfigs'            : 'isleofberkperformance.mixins.json'
        ])
    }
}

// Keep release artifacts byte-for-byte reproducible across clean builds.
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar.finalizedBy('reobfJar')

/**
 * ForgeGradle reobfJar (RenameJarInPlace / SpecialSource JarOutputStream) always
 * rewrites ZIP timestamps and may rewrite extra fields. Gradle Jar reproducibility
 * settings do not apply to that in-place rename. This task only canonicalizes ZIP
 * metadata: entry contents, order, manifest, refmap, and bytecode stay unchanged.
 */
tasks.register('canonicalizeReobfJar') {
    group = 'build'
    description = 'Canonicalize ZIP timestamps/extra metadata on the reobfuscated primary JAR.'
    dependsOn 'reobfJar'
    doLast {
        def primary = file("${buildDir}/libs/${archivesBaseName}-${project.version}.jar")
        canonicalizeReobfZipMetadata(primary)
        logger.lifecycle("canonicalizeReobfJar: deterministic ZIP metadata written for ${primary.name}")
    }
}

tasks.configureEach { task ->
    if (task.name == 'reobfJar') {
        task.finalizedBy 'canonicalizeReobfJar'
    }
}

/**
 * Rejects a packaged primary JAR that bundles Isle of Berk implementation classes/resources
 * or deadlock-fix package/resource markers. Companion-only scope enforcement.
 * Descriptive mentions of the separate deadlock-fix mod in mods.toml are allowed.
 */
tasks.register('auditPackagedJar') {
    group = 'verification'
    description = 'Fails if the primary JAR bundles IoB classes/resources or deadlock-fix markers.'
    dependsOn 'canonicalizeReobfJar'
    doLast {
        def libsDir = file("${buildDir}/libs")
        def expectedName = "${archivesBaseName}-${project.version}.jar"
        def primary = file("${libsDir}/${expectedName}")
        if (!primary.isFile()) {
            throw new GradleException("auditPackagedJar: expected primary JAR missing: ${primary}")
        }
        def forbiddenPathPrefixes = [
                'com/GACMD/isleofberk/',
                'network/vonix/isleofberkdeadlockfix/'
        ]
        // Packaged deadlock-fix artifact markers (not prose about the separate optional mod).
        def forbiddenExactResources = [
                'isleofberkdeadlockfix.mixins.json',
                'isleofberkdeadlockfix.refmap.json'
        ] as Set
        def forbiddenClassNameMarkers = [
                'IsleOfBerkDeadlockFix',
                'ADragonBaseMixin',
                'AltFollowGoalMixin'
        ]
        def allowedClassPrefix = 'network/vonix/isleofberkperformance/'
        def allowedNonClass = [
                'pack.mcmeta',
                'isleofberkperformance.mixins.json',
                'isleofberkperformance.refmap.json',
                'META-INF/mods.toml',
                'META-INF/MANIFEST.MF'
        ] as Set

        def violations = [] as List
        def classEntries = [] as List
        def resourceEntries = [] as List
        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(primary)
        try {
            zip.entries().each { entry ->
                def normalized = entry.name.replace('\\', '/')
                if (normalized.endsWith('/')) {
                    return
                }
                forbiddenPathPrefixes.each { prefix ->
                    if (normalized.startsWith(prefix)) {
                        violations << "forbidden bundled path: ${normalized}"
                    }
                }
                if (forbiddenExactResources.contains(normalized)) {
                    violations << "forbidden deadlock-fix resource: ${normalized}"
                }
                // Any path segment that is the deadlock-fix package/mod id as a resource root.
                if (normalized == 'isleofberkdeadlockfix' || normalized.startsWith('isleofberkdeadlockfix/')) {
                    violations << "forbidden deadlock-fix marker path: ${normalized}"
                }
                if (normalized.endsWith('.class')) {
                    classEntries << normalized
                    if (!normalized.startsWith(allowedClassPrefix)) {
                        violations << "unexpected class outside companion package: ${normalized}"
                    }
                    def simple = normalized.substring(normalized.lastIndexOf('/') + 1).replace('.class', '')
                    forbiddenClassNameMarkers.each { marker ->
                        if (simple == marker || simple.endsWith(marker)) {
                            violations << "forbidden deadlock-fix class marker: ${normalized}"
                        }
                    }
                } else {
                    resourceEntries << normalized
                    if (!allowedNonClass.contains(normalized)) {
                        violations << "unexpected resource outside companion allowlist: ${normalized}"
                    }
                }
            }
        } finally {
            zip.close()
        }

        if (classEntries.isEmpty()) {
            violations << 'primary JAR contains no companion classes'
        }
        if (!violations.isEmpty()) {
            throw new GradleException("auditPackagedJar FAILED for ${primary.name}:\n  - " + violations.join('\n  - '))
        }
        logger.lifecycle(
                "auditPackagedJar OK: ${primary.name} (${classEntries.size()} classes, ${resourceEntries.size()} resources, companion-only)"
        )
    }
}

tasks.named('build').configure {
    dependsOn 'auditPackagedJar'
}

tasks.named('check').configure {
    dependsOn 'auditPackagedJar'
    dependsOn 'mappingFixture'
    dependsOn 'rendererBytecodeFixture'
    dependsOn 'gameplayBytecodeFixture'
    dependsOn 'configFixture'
    dependsOn 'aiMoveCadenceFixture'
    dependsOn 'mixinLifecycleFixture'
    dependsOn 'infoZipUxExtraFixture'
}

tasks.register('mappingFixture') {
    group = 'verification'
    description = 'Checks the WrappedGoal official-to-SRG accessor mapping in the packaged artifact.'
    dependsOn 'canonicalizeReobfJar'
    doLast {
        def primary = file("${buildDir}/libs/${archivesBaseName}-${project.version}.jar")
        def refmap = new java.util.zip.ZipFile(primary).withCloseable { zip ->
            def entry = zip.getEntry('isleofberkperformance.refmap.json')
            if (entry == null) {
                throw new GradleException("mappingFixture: packaged refmap missing from ${primary}")
            }
            zip.getInputStream(entry).getText('UTF-8')
        }
        if (!refmap.contains('WrappedGoal;m_8056_') || !refmap.contains('WrappedGoal;m_8041_')) {
            throw new GradleException('mappingFixture: packaged refmap is missing the SRG WrappedGoal start/stop selectors')
        }
        if (refmap.contains('WrappedGoal;getGoal')) {
            throw new GradleException('mappingFixture: packaged refmap contains an unmapped WrappedGoal selector')
        }

        def srg = file("${buildDir}/createMcpToSrg/output.tsrg").getText('UTF-8')
        if (!srg.contains('getGoal ()Lnet/minecraft/world/entity/ai/goal/Goal; m_26015_')) {
            throw new GradleException('mappingFixture: pinned official-to-SRG mapping does not contain getGoal -> m_26015_')
        }
        def classBytes = new java.util.zip.ZipFile(primary).withCloseable { zip ->
            def entry = zip.getEntry('network/vonix/isleofberkperformance/mixin/WrappedGoalMixin.class')
            if (entry == null) {
                throw new GradleException('mappingFixture: packaged WrappedGoalMixin.class is missing')
            }
            zip.getInputStream(entry).bytes
        }
        def classText = new String(classBytes, 'ISO-8859-1')
        if (!classText.contains('m_26015_')) {
            throw new GradleException('mappingFixture: packaged WrappedGoalMixin.class does not invoke m_26015_')
        }
        if (classText.contains('getGoal')) {
            throw new GradleException('mappingFixture: packaged WrappedGoalMixin.class retains the unmapped getGoal accessor')
        }
        logger.lifecycle('mappingFixture: PASS (official getGoal -> SRG m_26015_; refmap and packaged bytecode verified)')
    }
}

tasks.register('configFixture') {
    group = 'verification'
    description = 'Checks the deterministic common-config fixture against PerformanceConfig.SPEC defaults.'
    doLast {
        def fixture = file("${projectDir}/config/isleofberkperformance.toml")
        def configSource = file("${projectDir}/src/main/java/network/vonix/isleofberkperformance/config/PerformanceConfig.java")
        if (!fixture.isFile()) {
            throw new GradleException("configFixture: missing ${fixture}")
        }
        if (!configSource.isFile()) {
            throw new GradleException("configFixture: missing ${configSource}")
        }
        def text = fixture.getText('UTF-8')
        def spec = configSource.getText('UTF-8')

        def expected = [
                ai_move_throttling_enabled: extractSpecDefault(spec, 'define("ai_move_throttling_enabled"', 'true'),
                ai_move_interval_ticks: extractSpecRangeDefault(spec, 'defineInRange("ai_move_interval_ticks"', '4'),
                egg_hatch_check_interval_ticks: extractSpecRangeDefault(spec, 'defineInRange("egg_hatch_check_interval_ticks"', '20'),
                shock_particle_interval_ticks: extractSpecRangeDefault(spec, 'defineInRange("shock_particle_interval_ticks"', '8')
        ]
        expected.each { key, value ->
            def assignment = "${key} = ${value}"
            if (!text.contains(assignment)) {
                throw new GradleException("configFixture: fixture/SPEC mismatch for ${assignment}")
            }
        }
        [
                'Upstream/normal behavior in Isle of Berk 1.2.0: 20 ticks.',
                'Upstream/normal behavior in Isle of Berk 1.2.0: 8 ticks.',
                'Damage remains fixed at 20 ticks'
        ].each { required ->
            if (!text.contains(required)) {
                throw new GradleException("configFixture: required text missing: ${required}")
            }
        }
        logger.lifecycle("configFixture: PASS (COMMON keys match PerformanceConfig.SPEC defaults ${expected})")
    }
}

tasks.register('aiMoveCadenceFixture', JavaExec) {
    group = 'verification'
    description = 'Checks the first-request-then-interval AI cadence predicate.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'network.vonix.isleofberkperformance.verification.AiMoveCadenceFixture'
    dependsOn testClasses
}

tasks.register('mixinLifecycleFixture', JavaExec) {
    group = 'verification'
    description = 'Checks that target canUse/start/stop methods remain untouched and reset stays in WrappedGoal.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'network.vonix.isleofberkperformance.verification.MixinLifecycleFixture'
    dependsOn testClasses
}

/**
 * Deterministic read-only extra-field fixture. Does not mutate the release JAR.
 * Builds synthetic Info-ZIP 0x5455 (UT), NTFS 0x000a, and Info-ZIP 0x5855 (UX)
 * payloads and proves canonicalizeReobfZipMetadata / zeroZipTimestampExtra
 * change only selected timestamp bytes. Flags, reserved prefix, UID/GID,
 * other attributes, and trailing/unknown bytes are preserved. Malformed,
 * truncated, zero-length, and short timestamp layouts fail closed.
 */
tasks.register('infoZipUxExtraFixture') {
    group = 'verification'
    description = 'Checks UT/NTFS/UX timestamps are canonicalized while non-timestamp bytes are preserved.'
    doLast {
        runInfoZipUxExtraFixture()
    }
}

static int zipU16(byte[] bytes, int offset) {
    return (bytes[offset] & 0xff) | ((bytes[offset + 1] & 0xff) << 8)
}

static long zipU32(byte[] bytes, int offset) {
    return (bytes[offset] & 0xffL) |
            ((bytes[offset + 1] & 0xffL) << 8) |
            ((bytes[offset + 2] & 0xffL) << 16) |
            ((bytes[offset + 3] & 0xffL) << 24)
}

static void zipW16(byte[] bytes, int offset, int value) {
    bytes[offset] = (byte) (value & 0xff)
    bytes[offset + 1] = (byte) ((value >> 8) & 0xff)
}

static void zipW32(byte[] bytes, int offset, long value) {
    bytes[offset] = (byte) (value & 0xff)
    bytes[offset + 1] = (byte) ((value >> 8) & 0xff)
    bytes[offset + 2] = (byte) ((value >> 16) & 0xff)
    bytes[offset + 3] = (byte) ((value >> 24) & 0xff)
}

static void zeroZipTimestampExtra(byte[] bytes, int offset, int length) {
    int cursor = 0
    while (cursor + 4 <= length) {
        int id = zipU16(bytes, offset + cursor)
        int size = zipU16(bytes, offset + cursor + 2)
        if (cursor + 4 + size > length) {
            if (id == 0x5455) {
                throw new GradleException("canonicalizeReobfJar: truncated Info-ZIP 0x5455 extra field")
            }
            if (id == 0x000a) {
                throw new GradleException("canonicalizeReobfJar: truncated NTFS 0x000a extra field")
            }
            if (id == 0x5855) {
                throw new GradleException("canonicalizeReobfJar: truncated Info-ZIP 0x5855 extra field")
            }
            break
        }
        int payload = offset + cursor + 4
        if (id == 0x5455) {
            // UT extra: flags bits 0x01/0x02/0x04 select mtime/atime/ctime.
            // Zero only selected timestamp bytes; preserve flags and trailing/unknown bytes.
            if (size < 1) {
                throw new GradleException("canonicalizeReobfJar: Info-ZIP 0x5455 extra field missing flags")
            }
            int flags = bytes[payload] & 0xff
            int tsCursor = 1
            [0x01, 0x02, 0x04].each { bit ->
                if ((flags & bit) != 0) {
                    if (tsCursor + 4 > size) {
                        throw new GradleException("canonicalizeReobfJar: truncated Info-ZIP 0x5455 timestamp")
                    }
                    for (int i = 0; i < 4; i++) {
                        bytes[payload + tsCursor + i] = 0
                    }
                    tsCursor += 4
                }
            }
        } else if (id == 0x5855) {
            // Info-ZIP Unix extra (UX): AcTime(4) + ModTime(4) [+ UID(2) + GID(2)].
            // Canonicalize only timestamp bytes; preserve UID/GID and any trailing bytes.
            if (size < 8) {
                throw new GradleException("canonicalizeReobfJar: truncated Info-ZIP 0x5855 timestamp payload")
            }
            for (int i = 0; i < 8; i++) {
                bytes[payload + i] = 0
            }
        } else if (id == 0x000a) {
            // NTFS extra: 4-byte reserved prefix, then tag/size/payload records.
            if (size < 4) {
                throw new GradleException("canonicalizeReobfJar: NTFS 0x000a extra field missing reserved prefix")
            }
            int tagCursor = 4
            while (tagCursor < size) {
                if (tagCursor + 4 > size) {
                    throw new GradleException("canonicalizeReobfJar: malformed NTFS 0x000a attribute header")
                }
                int tag = zipU16(bytes, payload + tagCursor)
                int tagSize = zipU16(bytes, payload + tagCursor + 2)
                if (tagCursor + 4 + tagSize > size) {
                    throw new GradleException("canonicalizeReobfJar: truncated NTFS 0x000a attribute record")
                }
                if (tag == 1) {
                    if (tagSize < 24) {
                        throw new GradleException("canonicalizeReobfJar: NTFS 0x000a tag-1 timestamp payload too short")
                    }
                    for (int i = 0; i < 24; i++) {
                        bytes[payload + tagCursor + 4 + i] = 0
                    }
                }
                tagCursor += 4 + tagSize
            }
        }
        cursor += 4 + size
    }
}

static void canonicalizeReobfZipMetadata(File jarFile) {
    if (!jarFile.isFile()) {
        throw new GradleException("canonicalizeReobfJar: expected reobfuscated JAR missing: ${jarFile}")
    }
    byte[] bytes = jarFile.bytes
    if (bytes.length < 22) {
        throw new GradleException("canonicalizeReobfJar: ${jarFile.name} is too small to be a ZIP")
    }

    int eocd = -1
    int minEocd = Math.max(0, bytes.length - 22 - 0xFFFF)
    for (int i = bytes.length - 22; i >= minEocd; i--) {
        if (zipU32(bytes, i) == 0x06054b50L) {
            eocd = i
            break
        }
    }
    if (eocd < 0) {
        throw new GradleException("canonicalizeReobfJar: ZIP end-of-central-directory not found in ${jarFile.name}")
    }
    int commentLen = zipU16(bytes, eocd + 20)
    if (eocd + 22 + commentLen != bytes.length) {
        throw new GradleException("canonicalizeReobfJar: ZIP64 or trailing data is not supported for ${jarFile.name}")
    }
    if (eocd >= 20 && zipU32(bytes, eocd - 20) == 0x07064b50L) {
        throw new GradleException("canonicalizeReobfJar: ZIP64 locator is not supported for ${jarFile.name}")
    }

    int entryCount = zipU16(bytes, eocd + 10)
    long cdSize = zipU32(bytes, eocd + 12)
    long cdOffset = zipU32(bytes, eocd + 16)
    if (cdOffset + cdSize != eocd) {
        throw new GradleException("canonicalizeReobfJar: central directory bounds are invalid in ${jarFile.name}")
    }

    def before = [] as List
    // DOS 1980-02-01 00:00:00; same fixed date Gradle uses for reproducible JARs.
    int dosTime = 0
    int dosDate = (0 << 9) | (2 << 5) | 1
    int pos = (int) cdOffset
    for (int n = 0; n < entryCount; n++) {
        if (pos + 46 > bytes.length || zipU32(bytes, pos) != 0x02014b50L) {
            throw new GradleException("canonicalizeReobfJar: central directory entry ${n} is invalid")
        }
        int nameLen = zipU16(bytes, pos + 28)
        int extraLen = zipU16(bytes, pos + 30)
        int fileCommentLen = zipU16(bytes, pos + 32)
        long localOffset = zipU32(bytes, pos + 42)
        int local = (int) localOffset
        if (local + 30 > bytes.length || zipU32(bytes, local) != 0x04034b50L) {
            throw new GradleException("canonicalizeReobfJar: local header for entry ${n} is invalid")
        }
        int localNameLen = zipU16(bytes, local + 26)
        int localExtraLen = zipU16(bytes, local + 28)
        String name = new String(bytes, pos + 46, nameLen, 'UTF-8')
        if (localNameLen != nameLen || new String(bytes, local + 30, localNameLen, 'UTF-8') != name) {
            throw new GradleException("canonicalizeReobfJar: local/central name mismatch for ${name}")
        }
        before << [
                name          : name,
                crc           : zipU32(bytes, pos + 16),
                compressed    : zipU32(bytes, pos + 20),
                uncompressed  : zipU32(bytes, pos + 24)
        ]

        zipW16(bytes, pos + 12, dosTime)
        zipW16(bytes, pos + 14, dosDate)
        zeroZipTimestampExtra(bytes, pos + 46 + nameLen, extraLen)

        zipW16(bytes, local + 10, dosTime)
        zipW16(bytes, local + 12, dosDate)
        zeroZipTimestampExtra(bytes, local + 30 + localNameLen, localExtraLen)

        pos += 46 + nameLen + extraLen + fileCommentLen
    }
    if (pos != eocd) {
        throw new GradleException("canonicalizeReobfJar: central directory size mismatch in ${jarFile.name}")
    }

    jarFile.bytes = bytes

    java.util.zip.ZipFile zip = new java.util.zip.ZipFile(jarFile)
    try {
        def after = [] as List
        zip.entries().each { entry ->
            after << [
                    name         : entry.name,
                    crc          : entry.crc & 0xffffffffL,
                    compressed   : entry.compressedSize & 0xffffffffL,
                    uncompressed : entry.size & 0xffffffffL
            ]
            zip.getInputStream(entry).withCloseable { stream ->
                byte[] buf = new byte[8192]
                while (stream.read(buf) != -1) {
                    // Force CRC validation of unchanged entry contents.
                }
            }
        }
        if (after != before) {
            throw new GradleException("canonicalizeReobfJar: entry contents/order changed while rewriting ZIP metadata")
        }
    } finally {
        zip.close()
    }
}

static byte[] concatZipBytes(byte[]... parts) {
    int total = 0
    for (int i = 0; i < parts.length; i++) {
        total += parts[i].length
    }
    byte[] out = new byte[total]
    int pos = 0
    for (int i = 0; i < parts.length; i++) {
        System.arraycopy(parts[i], 0, out, pos, parts[i].length)
        pos += parts[i].length
    }
    return out
}

static byte[] zipExtraBlock(int id, byte[] payload) {
    byte[] block = new byte[4 + payload.length]
    zipW16(block, 0, id)
    zipW16(block, 2, payload.length)
    System.arraycopy(payload, 0, block, 4, payload.length)
    return block
}

static byte[] zipNtfsAttribute(int tag, byte[] attrPayload) {
    byte[] rec = new byte[4 + attrPayload.length]
    zipW16(rec, 0, tag)
    zipW16(rec, 2, attrPayload.length)
    System.arraycopy(attrPayload, 0, rec, 4, attrPayload.length)
    return rec
}

static byte[] fillZipBytes(int length, int startValue) {
    byte[] out = new byte[length]
    for (int i = 0; i < length; i++) {
        out[i] = (byte) ((startValue + i) & 0xff)
    }
    return out
}

static byte[] zipSingleByte(int value) {
    return [(byte) (value & 0xff)] as byte[]
}

static byte[] infoZipUxPayload(byte[] atime, byte[] mtime, byte[] uid, byte[] gid) {
    return concatZipBytes(atime, mtime, uid, gid)
}

static byte[] findZipExtraPayload(byte[] extra, int extraLength, int wantedId) {
    int cursor = 0
    while (cursor + 4 <= extraLength) {
        int id = zipU16(extra, cursor)
        int size = zipU16(extra, cursor + 2)
        if (cursor + 4 + size > extraLength) {
            throw new GradleException("infoZipUxExtraFixture: truncated extra field 0x${Integer.toHexString(id)}")
        }
        if (id == wantedId) {
            byte[] payload = new byte[size]
            System.arraycopy(extra, cursor + 4, payload, 0, size)
            return payload
        }
        cursor += 4 + size
    }
    return null
}

static byte[] sliceZipBytes(byte[] src, int from, int toExclusive) {
    if (src == null || from < 0 || toExclusive < from || toExclusive > src.length) {
        throw new GradleException("infoZipUxExtraFixture: invalid slice ${from}..${toExclusive} of ${src == null ? -1 : src.length}")
    }
    byte[] out = new byte[toExclusive - from]
    System.arraycopy(src, from, out, 0, out.length)
    return out
}

static void requireZipBytes(String label, byte[] actual, byte[] expected) {
    if (actual == null) {
        throw new GradleException("infoZipUxExtraFixture: ${label}: missing bytes")
    }
    if (actual.length != expected.length) {
        throw new GradleException("infoZipUxExtraFixture: ${label}: length ${actual.length} != ${expected.length}")
    }
    for (int i = 0; i < expected.length; i++) {
        if (actual[i] != expected[i]) {
            throw new GradleException("infoZipUxExtraFixture: ${label}: byte ${i} changed")
        }
    }
}

static byte[] buildMinimalStoredZip(String name, byte[] payload, byte[] extra, int dosTime, int dosDate) {
    byte[] nameBytes = name.getBytes('UTF-8')
    def crc32 = new java.util.zip.CRC32()
    crc32.update(payload)
    long crc = crc32.value
    int nameLen = nameBytes.length
    int extraLen = extra.length
    int localLen = 30 + nameLen + extraLen + payload.length
    int cdLen = 46 + nameLen + extraLen
    byte[] zip = new byte[localLen + cdLen + 22]
    int p = 0
    zipW32(zip, p, 0x04034b50L); p += 4
    zipW16(zip, p, 20); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, dosTime); p += 2
    zipW16(zip, p, dosDate); p += 2
    zipW32(zip, p, crc); p += 4
    zipW32(zip, p, payload.length); p += 4
    zipW32(zip, p, payload.length); p += 4
    zipW16(zip, p, nameLen); p += 2
    zipW16(zip, p, extraLen); p += 2
    System.arraycopy(nameBytes, 0, zip, p, nameLen); p += nameLen
    System.arraycopy(extra, 0, zip, p, extraLen); p += extraLen
    System.arraycopy(payload, 0, zip, p, payload.length); p += payload.length
    int cdOff = p
    zipW32(zip, p, 0x02014b50L); p += 4
    zipW16(zip, p, 20); p += 2
    zipW16(zip, p, 20); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, dosTime); p += 2
    zipW16(zip, p, dosDate); p += 2
    zipW32(zip, p, crc); p += 4
    zipW32(zip, p, payload.length); p += 4
    zipW32(zip, p, payload.length); p += 4
    zipW16(zip, p, nameLen); p += 2
    zipW16(zip, p, extraLen); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW32(zip, p, 0L); p += 4
    zipW32(zip, p, 0L); p += 4
    System.arraycopy(nameBytes, 0, zip, p, nameLen); p += nameLen
    System.arraycopy(extra, 0, zip, p, extraLen); p += extraLen
    zipW32(zip, p, 0x06054b50L); p += 4
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 0); p += 2
    zipW16(zip, p, 1); p += 2
    zipW16(zip, p, 1); p += 2
    zipW32(zip, p, cdLen); p += 4
    zipW32(zip, p, cdOff); p += 4
    zipW16(zip, p, 0); p += 2
    return zip
}

static void expectGradleFailure(String label, String needle, Closure action) {
    try {
        action.call()
        throw new GradleException("infoZipUxExtraFixture: ${label} did not fail closed")
    } catch (GradleException ex) {
        if (ex.message != null && ex.message.contains('did not fail closed')) {
            throw ex
        }
        if (ex.message == null || !ex.message.contains(needle)) {
            throw new GradleException("infoZipUxExtraFixture: ${label}: unexpected failure: ${ex.message}")
        }
    }
}

static void assertUtSelectedTimestamps(int flags, int selectedCount, byte[] trailing, String label) {
    byte[] timestamps = fillZipBytes(selectedCount * 4, 0xA0)
    byte[] extra = zipExtraBlock(0x5455, concatZipBytes(zipSingleByte(flags), timestamps, trailing))
    int beforeLen = extra.length
    zeroZipTimestampExtra(extra, 0, extra.length)
    if (extra.length != beforeLen) {
        throw new GradleException("infoZipUxExtraFixture: ${label}: extra-field length changed")
    }
    byte[] after = findZipExtraPayload(extra, extra.length, 0x5455)
    requireZipBytes("${label} flags", sliceZipBytes(after, 0, 1), zipSingleByte(flags))
    requireZipBytes("${label} timestamps", sliceZipBytes(after, 1, 1 + timestamps.length), new byte[timestamps.length])
    if (trailing.length > 0) {
        requireZipBytes("${label} trailing", sliceZipBytes(after, 1 + timestamps.length, after.length), trailing)
    }
}

