tasks.register('candidateIdentityFixture') {
    group = 'verification'
    description = 'Hashed source-to-artifact provenance: every build input digest, deps, exclusions, distinct successor version, JAR match.'
    dependsOn canonicalizeReobfJar
    doLast {
        def root = projectDir
        def manifestPath = file("${root}/evidence/candidate-manifest.json")
        if (!manifestPath.isFile()) {
            throw new GradleException("candidateIdentityFixture: missing ${manifestPath}")
        }
        def manifest = new groovy.json.JsonSlurper().parse(manifestPath)
        def sha256 = { File f ->
            java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
        }
        def jar = file("${buildDir}/libs/${archivesBaseName}-${project.version}.jar")
        if (!jar.isFile()) {
            throw new GradleException("candidateIdentityFixture: missing jar ${jar}")
        }
        if (project.version == '1.0.0') {
            throw new GradleException('candidateIdentityFixture: successor must not reuse published 1.0.0 coordinate')
        }
        if (manifest.version != project.version.toString()) {
            throw new GradleException("candidateIdentityFixture: manifest.version ${manifest.version} != project.version ${project.version}")
        }
        if (manifest.artifact?.file != jar.name) {
            throw new GradleException("candidateIdentityFixture: manifest artifact file ${manifest.artifact?.file} != ${jar.name}")
        }
        def jarSha = sha256(jar)
        if (manifest.artifact?.sha256 != jarSha) {
            throw new GradleException("candidateIdentityFixture: manifest sha256 ${manifest.artifact?.sha256} != jar ${jarSha}")
        }
        if ((manifest.artifact?.size as Long) != jar.length()) {
            throw new GradleException("candidateIdentityFixture: manifest size mismatch")
        }

        // Predecessor published 1.0.0 evidence must remain untouched and distinct.
        def predecessor = file("${root}/release-download/isleof-berk-performance-patches-1.0.0.jar")
        if (!predecessor.isFile()) {
            throw new GradleException('candidateIdentityFixture: missing untouched predecessor release-download/1.0.0 jar')
        }
        def predSha = sha256(predecessor)
        def expectedPred = '15df9183a49e4d83a9d5e0583cec61a5a90549d873e5a64bb0116401988667e2'
        if (predSha != expectedPred) {
            throw new GradleException("candidateIdentityFixture: predecessor jar hash changed (${predSha}); must remain ${expectedPred}")
        }
        if (predSha == jarSha) {
            throw new GradleException('candidateIdentityFixture: successor jar hash must differ from predecessor 1.0.0')
        }
        if (manifest.predecessor?.sha256 != expectedPred) {
            throw new GradleException('candidateIdentityFixture: manifest.predecessor.sha256 must pin published 1.0.0')
        }

        // Required packaged classes for this successor.
        def requiredClasses = [
                'network/vonix/isleofberkperformance/internal/AiMoveCadence.class',
                'network/vonix/isleofberkperformance/internal/PerformanceSettings.class'
        ] as Set
        def found = [] as Set
        def modsTomlText = null
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            zip.entries().each { e ->
                def n = e.name.replace('\\', '/')
                found << n
                if (n == 'META-INF/mods.toml') {
                    modsTomlText = zip.getInputStream(e).getText('UTF-8')
                }
            }
        }
        requiredClasses.each { c ->
            if (!found.contains(c)) {
                throw new GradleException("candidateIdentityFixture: jar missing ${c}")
            }
        }
        if (modsTomlText == null || !modsTomlText.contains("version=\"${project.version}\"")) {
            throw new GradleException("candidateIdentityFixture: packaged mods.toml missing expanded version ${project.version}")
        }

        // Dependencies: exact digests.
        ['isleofberk', 'geckolib', 'variant_loader', 'deadlock_fix'].each { key ->
            def dep = manifest.dependencies?.get(key)
            if (dep == null || !dep.sha256 || !dep.path) {
                throw new GradleException("candidateIdentityFixture: dependency ${key} incomplete in manifest")
            }
            def p = file(dep.path as String)
            if (!p.isFile()) {
                throw new GradleException("candidateIdentityFixture: dependency path missing ${p}")
            }
            def d = sha256(p)
            if (d != dep.sha256) {
                throw new GradleException("candidateIdentityFixture: dependency ${key} digest mismatch ${d} != ${dep.sha256}")
            }
        }

        // Hashed build inputs: every listed path must exist and match sha256.
        def inputs = manifest.inputs
        if (!(inputs instanceof Map) || inputs.isEmpty()) {
            throw new GradleException('candidateIdentityFixture: manifest.inputs must be a non-empty path->sha256 map')
        }
        def requiredPrefixes = [
                'src/main/java/',
                'src/main/resources/',
                'src/test/java/',
                'build.gradle',
                'settings.gradle',
                'gradle.properties',
                'gradlew',
                'gradle/wrapper/'
        ]
        requiredPrefixes.each { prefix ->
            def hit = inputs.keySet().any { ((String) it).startsWith(prefix) || it == prefix }
            if (!hit) {
                throw new GradleException("candidateIdentityFixture: manifest.inputs missing required prefix/entry ${prefix}")
            }
        }
        // Every current source/test/resource file must be hashed in the manifest.
        def discover = { String relDir ->
            def dir = file("${root}/${relDir}")
            def out = [] as List
            if (dir.isDirectory()) {
                dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    out << root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                }
            }
            return out
        }
        def mustHash = [] as List
        mustHash.addAll(discover('src/main/java'))
        mustHash.addAll(discover('src/main/resources'))
        mustHash.addAll(discover('src/test/java'))
        mustHash.addAll([
                'build.gradle',
                'settings.gradle',
                'gradle.properties',
                'gradlew',
                'gradlew.bat',
                'gradle/wrapper/gradle-wrapper.properties',
                'gradle/wrapper/gradle-wrapper.jar',
                'config/isleofberkperformance.toml',
                'README.md',
                'CHANGELOG.md',
                'CANDIDATE-REPORT.md',
                'CANDIDATE-REPORT.successor.md'
        ])
        // Include every mixin and verification fixture explicitly by discovery above.
        mustHash.unique().each { rel ->
            def f = file("${root}/${rel}")
            if (!f.isFile()) {
                throw new GradleException("candidateIdentityFixture: required build input missing on disk: ${rel}")
            }
            def expected = inputs[rel]
            if (expected == null) {
                throw new GradleException("candidateIdentityFixture: manifest.inputs missing hash for ${rel}")
            }
            def actual = sha256(f)
            if (actual != expected) {
                throw new GradleException("candidateIdentityFixture: hash mismatch for ${rel}: manifest=${expected} disk=${actual}")
            }
        }
        // No stale manifest entries for missing files (except explicit optional notes).
        inputs.each { rel, expected ->
            def f = file("${root}/${rel}")
            if (!f.isFile()) {
                throw new GradleException("candidateIdentityFixture: manifest.inputs references missing file ${rel}")
            }
            def actual = sha256(f)
            if (actual != expected) {
                throw new GradleException("candidateIdentityFixture: stale hash for ${rel}")
            }
        }

        def exclusions = manifest.exclusions as List
        if (exclusions == null || !exclusions.contains('release-download/**') || !exclusions.contains('evidence/**') || !exclusions.contains('.offline-plugin-repo/**')) {
            throw new GradleException('candidateIdentityFixture: exclusions must list release-download/**, evidence/**, .offline-plugin-repo/**')
        }

        logger.lifecycle("candidateIdentityFixture: PASS (version=${project.version}, jar=${jarSha}, inputs=${inputs.size()}, predecessor=${predSha})")
    }
}

tasks.register('documentationConsistencyGate') {
    group = 'verification'
    description = 'Checks README/config/successor report cadence wording and distinct successor artifact identity.'
    dependsOn canonicalizeReobfJar
    doLast {
        def jar = file("${buildDir}/libs/${archivesBaseName}-${project.version}.jar")
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        def readme = file('README.md').getText('UTF-8')
        def config = file('config/isleofberkperformance.toml').getText('UTF-8')
        def report = file('CANDIDATE-REPORT.md').getText('UTF-8')
        def successor = file('CANDIDATE-REPORT.successor.md')
        if (!successor.isFile()) {
            throw new GradleException('documentationConsistencyGate: missing CANDIDATE-REPORT.successor.md')
        }
        def succ = successor.getText('UTF-8')
        if (project.version.toString() == '1.0.0') {
            throw new GradleException('documentationConsistencyGate: project.version must be distinct prerelease successor, not 1.0.0')
        }
        if (!succ.contains(project.version.toString())) {
            throw new GradleException("documentationConsistencyGate: successor report missing version ${project.version}")
        }
        if (!succ.contains(jar.name)) {
            throw new GradleException("documentationConsistencyGate: successor report missing jar name ${jar.name}")
        }
        if (!succ.contains(sha)) {
            throw new GradleException('documentationConsistencyGate: successor report missing jar sha256')
        }
        if (!succ.contains('AiMoveCadence') || !succ.contains('PerformanceSettings')) {
            throw new GradleException('documentationConsistencyGate: successor report missing helper class inventory')
        }
        if (!succ.contains('15df9183a49e4d83a9d5e0583cec61a5a90549d873e5a64bb0116401988667e2')) {
            throw new GradleException('documentationConsistencyGate: successor report must cite predecessor 1.0.0 hash as distinct')
        }
        if (!readme.contains(project.version.toString()) && !readme.contains('1.0.1-rc.1')) {
            throw new GradleException('documentationConsistencyGate: README missing successor version identity')
        }
        if (!readme.contains('tick HEAD') && !readme.contains('tick() HEAD') && !readme.contains('one allow/deny decision')) {
            throw new GradleException('documentationConsistencyGate: README missing tick-HEAD cadence wording')
        }
        if (!config.contains('goal tick') && !config.contains('one allow/deny')) {
            throw new GradleException('documentationConsistencyGate: config missing tick-HEAD cadence wording')
        }
        if (report.contains('0.3.1-rc.1') && report.contains('7238b74e13167a59310cd1e9e14ff56048733a8755a272602a0aa6b0064a38c9') && !report.contains('HISTORICAL ARCHIVE')) {
            throw new GradleException('documentationConsistencyGate: CANDIDATE-REPORT still presents historical 0.3.1-rc.1 identity as current without archive banner')
        }
        if (readme.contains('36 fixed-resource methods passed') && !readme.contains('eight fixed-resource')) {
            throw new GradleException('documentationConsistencyGate: README still claims only historical 36 fixed-resource surface')
        }
        // Published 1.0.0 integrity block must remain for predecessor; successor must not overwrite it.
        if (!readme.contains('15df9183a49e4d83a9d5e0583cec61a5a90549d873e5a64bb0116401988667e2')) {
            throw new GradleException('documentationConsistencyGate: README must retain published 1.0.0 predecessor hash')
        }
        logger.lifecycle("documentationConsistencyGate: PASS (version=${project.version}, jar=${sha})")
    }
}
