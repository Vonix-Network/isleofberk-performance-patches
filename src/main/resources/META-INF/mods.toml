modLoader="javafml"
loaderVersion="[40,)"
license="MIT"
issueTrackerURL="https://github.com/Vonix-Network/isleofberk-performance-patches/issues"

[[mods]]
modId="isleofberkperformance"
version="${version}"
displayName="Isle of Berk Performance Patches"
displayTest="MATCH_VERSION"
description='''
Standalone Forge Mixin companion for Isle of Berk 1.2.0.
This is NOT a fork, reupload, or replacement of Isle of Berk: keep the original
isleofberk-1.2.0.jar installed. It does not bundle IoB classes or resources.
V1.3 is a successor candidate and targeted safe Mixin port of remaining Vonix
hot-path work that preserves original gameplay semantics. The Isle of Berk
Deadlock Fix remains a separate companion and is not included.
'''
authors="Vonix-Network"

[[dependencies.isleofberkperformance]]
modId="forge"
mandatory=true
versionRange="[40.3.0,40.4.0)"
ordering="NONE"
side="BOTH"

[[dependencies.isleofberkperformance]]
modId="minecraft"
mandatory=true
versionRange="[1.18.2,1.18.3)"
ordering="NONE"
side="BOTH"

# Exact Isle of Berk 1.2.0 only (Forge-valid half-open range ending before 1.2.0.1).
[[dependencies.isleofberkperformance]]
modId="isleofberk"
mandatory=true
versionRange="[1.2.0,1.2.0.1)"
ordering="AFTER"
side="BOTH"

# Validated against GeckoLib 3.0.57; IoB requires geckolib3 at runtime.
[[dependencies.isleofberkperformance]]
modId="geckolib3"
mandatory=true
versionRange="[3.0.57,3.0.58)"
ordering="AFTER"
side="BOTH"

