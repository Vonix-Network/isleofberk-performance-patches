modLoader="javafml"
loaderVersion="[40,)"
license="MIT"
issueTrackerURL="https://github.com/Vonix-Network/isleofberk-performance-patches/issues"

[[mods]]
modId="isleofberkperformance"
version="${version}"
displayName="Isle of Berk Performance Patches"
displayTest="MATCH_VERSION"
description='''
Standalone Forge Mixin companion for Isle of Berk 1.2.0.
This is NOT a fork, reupload, or replacement of Isle of Berk: keep the original
isleofberk-1.2.0.jar installed. It does not bundle IoB classes or resources.
V1.3.4 preserves the verified R4 performance work and the optional,
client-only Variant Loader 2.7.0 passenger-render guard. The 13 overlapping
model-resource Mixins are skipped whenever Variant Loader is present, regardless of declared version.
The passenger guard additionally requires the exact PassengerLayer.class
fingerprint and static renderPassenger descriptor; any fingerprint failure
disables only that optional guard. Non-empty passenger rendering remains
unchanged. The Isle of Berk Deadlock Fix remains a separate companion.
'''
authors="Vonix-Network"

[[dependencies.isleofberkperformance]]
modId="forge"
mandatory=true
versionRange="[40.3.0,40.4.0)"
ordering="NONE"
side="BOTH"

[[dependencies.isleofberkperformance]]
modId="minecraft"
mandatory=true
versionRange="[1.18.2,1.18.3)"
ordering="NONE"
side="BOTH"

# Exact Isle of Berk 1.2.0 only (Forge-valid half-open range ending before 1.2.0.1).
[[dependencies.isleofberkperformance]]
modId="isleofberk"
mandatory=true
versionRange="[1.2.0,1.2.0.1)"
ordering="AFTER"
side="BOTH"

# Validated against GeckoLib 3.0.57; IoB requires geckolib3 at runtime.
[[dependencies.isleofberkperformance]]
modId="geckolib3"
mandatory=true
versionRange="[3.0.57,3.0.58)"
ordering="AFTER"
side="BOTH"

# Optional Variant Loader presence integration. The 13 overlap Mixins are
# skipped for any present version; the passenger Mixin remains exact-gated.
[[dependencies.isleofberkperformance]]
modId="iobvariantloader"
mandatory=false
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

